services:
  artemis-broker:
    image: apache/activemq-artemis:2.40.0
    container_name: artemis-broker
    restart: unless-stopped
    ports:
      - "61616:61616"
      - "8161:8161"
    networks:
      - interop-network
    volumes:
      - ./conf/artemis-users.properties:/var/lib/artemis/etc/artemis-users.properties
      - ./conf/artemis-roles.properties:/var/lib/artemis/etc/artemis-roles.properties
      - ./conf/broker.xml:/var/lib/artemis/etc/broker.xml

networks:
  interop-network:
    name: interop-network
    driver: bridge
